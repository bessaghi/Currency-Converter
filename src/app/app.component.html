<mat-toolbar>
  <mat-icon aria-hidden="false"
            aria-label="attach_money"
            fontIcon="attach_money"
  />
  <span class="p-5">Currency Converter</span>
</mat-toolbar>

<div class="flex justify-center items-center h-screen gap-20">
  <mat-card appearance="raised">
    <mat-card-header>
      <mat-card-title>Convert the amount you need</mat-card-title>
      <mat-card-subtitle>You can update your own rate or use the real one</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="flex flex-col">
        <currency-rate/>
        <converter/>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card appearance="raised">
    <mat-card-header>
      <mat-card-title class="p-5">Latest results</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <history/>
    </mat-card-content>
  </mat-card>
</div>
